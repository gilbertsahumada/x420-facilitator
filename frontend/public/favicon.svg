<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hoja de marihuana roja estilizada -->
  <!-- Contorno principal de la hoja -->
  <path d="M50 10 
           C40 12, 32 18, 28 28
           C24 38, 26 50, 30 60
           C34 68, 40 72, 50 78
           C60 72, 66 68, 70 60
           C74 50, 76 38, 72 28
           C68 18, 60 12, 50 10 Z" 
        fill="#E84142" 
        stroke="#C73536" 
        stroke-width="1"/>
  
  <!-- Línea central (vena principal) -->
  <path d="M50 15 Q50 40, 50 75" 
        stroke="#C73536" 
        stroke-width="1.5" 
        stroke-linecap="round"
        fill="none"/>
  
  <!-- Venas laterales izquierda -->
  <path d="M45 25 Q42 30, 40 35" 
        stroke="#C73536" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M42 40 Q39 45, 37 50" 
        stroke="#C73536" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M38 55 Q36 60, 34 65" 
        stroke="#C73536" 
        stroke-width="0.7" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Venas laterales derecha -->
  <path d="M55 25 Q58 30, 60 35" 
        stroke="#C73536" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M58 40 Q61 45, 63 50" 
        stroke="#C73536" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M62 55 Q64 60, 66 65" 
        stroke="#C73536" 
        stroke-width="0.7" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Detalles de bordes - dientes de la hoja izquierda -->
  <path d="M32 30 Q31 32, 30 34" 
        stroke="#C73536" 
        stroke-width="0.5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M29 42 Q28 44, 27 46" 
        stroke="#C73536" 
        stroke-width="0.5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Detalles de bordes - dientes de la hoja derecha -->
  <path d="M68 30 Q69 32, 70 34" 
        stroke="#C73536" 
        stroke-width="0.5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <path d="M71 42 Q72 44, 73 46" 
        stroke="#C73536" 
        stroke-width="0.5" 
        stroke-linecap="round" 
        fill="none"/>
</svg>
